<div class="modal-header">
  <h4>Kreiraj novu kompaniju</h4>
  <button class="close-btn" (click)="otkazi()">✕</button>
</div>

<div class="modal-body">

  <div class="section">
    <label>Naziv kompanije</label>
    <input type="text" [(ngModel)]="naziv" name="naziv" />
  </div>

  <div class="grid-2">

    <div class="section">
      <label>Websajt</label>
      <input type="text" [(ngModel)]="websajt" name="websajt" />
    </div>

    <div class="section">
      <label>Kontakt</label>
      <input type="text" [(ngModel)]="kontakt" name="kontakt" />
    </div>

  </div>

</div>

<div class="actions">
  <button class="primary-btn" (click)="potvrdi()" [disabled]="saving || !naziv.trim()">
    {{ saving ? 'Kreiranje...' : 'Kreiraj' }}
  </button>
</div>
