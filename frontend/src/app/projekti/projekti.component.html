<div class="page">

  <header class="page-header">
    <div class="header-text">
      <h1 class="heading">Odaberi projekat</h1>
      <p class="subheading">Kliknite na projekat koji želite da otvorite</p>
    </div>
  </header>

  <div class="cards">
    <button
      class="card"
      *ngFor="let p of projects"
      (click)="goToProject(p.iteracija.id)">

      <div class="card-logo">
        <img [src]="p.image" [alt]="p.iteracija.naziv_projekta">
      </div>

      <div class="card-footer">
        <div class="card-meta">
          <span class="card-name">{{ p.iteracija.naziv_projekta }}</span>
          <span class="card-year">{{ p.iteracija.godina }}</span>
        </div>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
          </svg>
        </div>
      </div>

    </button>
  </div>

</div>
