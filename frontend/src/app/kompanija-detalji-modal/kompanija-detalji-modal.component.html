<div class="modal-header">
  <div class="header-identity">
    <div class="company-avatar">{{ data.naziv.charAt(0) }}</div>
    <div class="header-text">
      <h4 class="company-name">{{ data.naziv }}</h4>
      <p class="company-meta" *ngIf="data.websajt">{{ data.websajt }}</p>
    </div>
  </div>
  <button class="close-btn" (click)="zatvori()">✕</button>
</div>

<div class="modal-body">

  <div class="stats-section">
    <div class="stat-card stat-blue">
      <span class="stat-value">{{ data.brojCimanja }}</span>
      <span class="stat-label">Cimanja</span>
    </div>
    <div class="stat-card stat-green">
      <span class="stat-value">{{ data.brojOdobravanja }}</span>
      <span class="stat-label">Odobravanja</span>
    </div>
    <div class="stat-card stat-red">
      <span class="stat-value">{{ data.brojOdbijanja }}</span>
      <span class="stat-label">Odbijanja</span>
    </div>
  </div>

  <div class="form-grid">

    <div class="form-group full">
      <label>Naziv</label>
      <input type="text" [(ngModel)]="data.naziv" placeholder="Naziv kompanije" />
    </div>

    <div class="form-group">
      <label>Websajt</label>
      <input type="text" [(ngModel)]="data.websajt" placeholder="https://..." />
    </div>

    <div class="form-group">
      <label>Kontakt</label>
      <input type="text" [(ngModel)]="data.kontakt" placeholder="email ili telefon" />
    </div>

  </div>

  <div class="section-divider"></div>

  <div class="form-grid">

    <div class="form-group">
      <label>Stanje</label>
      <div class="custom-select" [class.open]="stanjeDropdownOpen" (click)="$event.stopPropagation()">
        <div class="select-display" (click)="toggleStanjeDropdown()">
          <span class="stanje-dot" [ngClass]="stanjeClass"></span>
          <span>{{ data.stanje }}</span>
          <svg class="arrow" viewBox="0 0 24 24">
            <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="select-options" *ngIf="stanjeDropdownOpen">
          <div class="option" *ngFor="let s of stanja" (click)="selectStanje(s)">{{ s }}</div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Zadužen član</label>
      <div class="custom-select" [class.open]="dropdownOpen" (click)="$event.stopPropagation()">
        <div class="select-display" (click)="toggleDropdown()">
          <span>{{ selectedKorisnikNaziv }}</span>
          <svg class="arrow" viewBox="0 0 24 24">
            <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="select-options" *ngIf="dropdownOpen">
          <div class="option empty" *ngIf="korisnici.length === 0">Nema članova za ovaj projekat</div>
          <div class="option" *ngFor="let k of korisnici" (click)="selectKorisnik(k)">
            {{ k.ime }} {{ k.prezime }}
          </div>
        </div>
      </div>
    </div>

    <div class="form-group full">
      <label>Napomena</label>
      <textarea rows="3" [(ngModel)]="data.napomena" placeholder="Dodaj napomenu..."></textarea>
    </div>

  </div>

</div>

<div class="actions">
  <button class="cancel-btn" (click)="zatvori()">Otkaži</button>
  <button class="primary-btn" (click)="sacuvaj()" [disabled]="saving">
    {{ saving ? 'Čuvanje...' : 'Sačuvaj' }}
  </button>
</div>
