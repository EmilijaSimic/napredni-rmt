<div class="modal-header">
  <h4>Dodaj {{ data.tipPartnera }} partnere</h4>
  <button class="close-btn" (click)="otkazi()">✕</button>
</div>

<div class="search-wrapper">
  <input
    type="text"
    placeholder="Pretraži partnere..."
    [(ngModel)]="searchTerm"
  />
</div>

<div class="modal-body" *ngIf="!loading; else loadingTpl">
  <div *ngFor="let k of filtriraneKompanije()" class="kompanija-item">
    <div class="row">
      <input type="checkbox" [checked]="selektovane.has(k.ID)" (change)="toggleSelektovan(k.ID)">
      <span>{{ k.naziv }}</span>
      <button class="details-button" (click)="toggleDetaljnije(k.ID)">Detaljnije</button>
    </div>

    <div *ngIf="otvorenoDetaljnije.has(k.ID)" class="detaljnije">
      <p data-label="Napomena">{{ k.napomena }}</p>
    </div>
  </div>
</div>

<ng-template #loadingTpl></ng-template>

<div class="actions">
  <button class="cancel-btn" (click)="otkazi()">Otkaži</button>
  <button class="primary-btn" [disabled]="saving || selektovane.size === 0" (click)="potvrdi()">
    {{ saving ? 'Dodavanje...' : 'Dodaj' }}
  </button>
</div>
