<div class="home-layout">
  <la-partneri-menu></la-partneri-menu>

  <div class="content">
    <div class="header">
      <h2>Promo Materijali</h2>
    </div>

    <ng-container *ngIf="isAdmin">
      <div class="upload-panel">
        <div class="select-wrapper">
          <label>Kompanija</label>
          <select [(ngModel)]="selectedKompanijaId">
            <option [ngValue]="null" disabled>Odaberi kompaniju...</option>
            <option *ngFor="let k of kompanije" [ngValue]="k.id">{{ k.naziv }}</option>
          </select>
        </div>

        <div class="file-row">
          <label class="file-label">
            <input type="file" accept="image/*,video/*" (change)="onFileSelected($event)" hidden>
            <span class="file-btn">{{ fileName || 'Odaberi fajl' }}</span>
          </label>

          <button
            class="upload-btn"
            [disabled]="!selectedFile || !selectedKompanijaId || isUploading"
            (click)="upload()">
            {{ isUploading ? 'Uploaduje se...' : 'Upload' }}
          </button>
        </div>

        <p class="error" *ngIf="uploadError">{{ uploadError }}</p>
      </div>

      <button class="sync-btn" [disabled]="isSyncing" (click)="syncTags()">
        {{ isSyncing ? 'Sinkronizacija...' : 'Sinkronizuj tagove' }}
      </button>
    </ng-container>

    <div class="search-row">
      <input
        class="search-input"
        type="text"
        placeholder="Pretraži po kompaniji ili imenu fajla..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()">
    </div>

    <p class="empty-msg" *ngIf="materijali.length === 0">Nema promo materijala.</p>

    <div *ngFor="let grupa of materijaliPoKompaniji" class="company-group">
      <p class="company-label">{{ grupa.naziv }} — {{ grupa.stavke.length }} materijal{{ grupa.stavke.length === 1 ? '' : 'a' }}</p>

      <div class="materials-grid">
        <div class="material-card" *ngFor="let m of grupa.stavke">
          <div class="media-wrapper">
            <video *ngIf="isVideo(m.url)" [src]="m.url" controls class="media"></video>
            <img *ngIf="!isVideo(m.url)" [src]="m.url" [alt]="m.originalnoIme" class="media">
          </div>
          <div class="card-footer">
            <span class="file-name" [title]="m.originalnoIme">{{ m.originalnoIme }}</span>
            <span class="date">{{ m.datumKreiranja | date:'d.M.yyyy.' }}</span>
            <button *ngIf="isAdmin" class="delete-btn" (click)="deleteMaterijal(m.id)">Obriši</button>
          </div>
          <div class="tag-row" *ngIf="m.tags && m.tags.length > 0">
            <span class="tag" *ngFor="let t of m.tags">{{ t }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
